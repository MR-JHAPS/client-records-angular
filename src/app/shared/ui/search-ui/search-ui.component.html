

<section class="mainSearchContainer shadow">

    <article class="searchBoxContainer">
      <input type="text"
            [formControl]="searchControl"
            class="searchBox form-control form-control-lg" placeholder="Search clients..." aria-label="Search" 
            [(ngModel)]="searchRequest.searchQuery">
      <button class="searchButton btn btn-primary" type="button" (click)="emitClientSearch()" >
        <i class="bi bi-search me-2"></i> Search
      </button>
    </article>

    <article class="filter">
        <div class="column1">
            @for (field of searchFieldsChild; track $index) {
                <div class="any">
                <input class="form-check-input" type="radio" name="filterOptions" id="all" value={{field.searchFieldValue}} 
                [(ngModel)]="searchRequest.searchBy" [checked]="field.searchFieldName==='any' || field.searchFieldName==='role'">
                <label class="form-check-label" for="all">{{field.searchFieldName}}</label>
                </div>
            }
