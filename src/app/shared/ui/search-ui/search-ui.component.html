

<section class="mainSearchContainer ">

    <article class="searchBoxContainer">
      <input type="text"
            [formControl]="searchControl"
            class="searchBox form-control form-control-lg" placeholder="Search clients..." aria-label="Search" 
            [(ngModel)]="searchRequest.searchQuery">
      <button class="searchButton btn btn-primary" type="button" (click)="emitClientSearch()" >
        <i class="bi bi-search me-2"></i> Search
      </button>
    </article>

    <article class="searchByContainer">
            @for (field of searchFieldsChild; track $index) {

              <div class="form-check form-check-inline searchBy">
                <input class="form-check-input" type="radio" name="inlineRadioOptions" 
                id={{field.searchFieldValue}}
                 value={{field.searchFieldValue}}
                 [(ngModel)]="searchRequest.searchBy" 
                 [checked]="field.searchFieldName==='any' || field.searchFieldName==='role'"
                 >
                <label class="form-check-label" for="inlineRadio1">{{field.searchFieldName}}</label>
              </div>
                <!-- <div class="searchBy"> -->
                    <!-- <input class="me-2" type="radio" name="filterOptions" id={{field.searchFieldValue}} value={{field.searchFieldValue}} 
                    [(ngModel)]="searchRequest.searchBy" 
                    [checked]="field.searchFieldName==='any' || field.searchFieldName==='role'">
                    <label class="form-check-label" for={{field.searchFieldValue}}>{{field.searchFieldName}}</label> -->
                <!-- </div> -->
            }
    </article>

  <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="option1">
  <label class="form-check-label" for="inlineRadio1">1</label>
</div> -->





</section>
